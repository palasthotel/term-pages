---
name: Build and release to WordPress.org

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and deploy to WordPress.org
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Notify on start
        run: |
          echo "🤖 Starting release process for tag $RELEASE_TAG…"
          echo "🤖 This may take a few minutes. Please wait."

      - name: Normalize release tag
        shell: bash
        run: |
          VERSION=${RELEASE_TAG#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Show release version
        run: echo "VERSION=${VERSION}"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check version numbers
        run: bash bin/version-checker.sh

      - name: Install SVN
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Pack plugin
        id: pack_plugin
        run: bash bin/pack.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: ./term-pages.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup packaged artifact
        if: always()
        run: rm -f ./term-pages.zip

      - name: Checkout WordPress SVN repository
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: svn checkout "${{ vars.SVN_REPO_URL }}" svn --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache --non-interactive --trust-server-cert

      - name: Prepare SVN & commit
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          ls -la
          cd svn
          ls -la
          VERSION=${VERSION}
          rm -rf trunk/* tags/$VERSION || true
          mkdir -p trunk tags/$VERSION
          cp -r ../public/* trunk/
          cp -r trunk/* tags/$VERSION/
          # assets/ holds the media for the wordpress.org plugin page (banner,
          # icon, screenshots). It is not part of the download, and the
          # repository is the source of truth for it — hence --delete.
          if [ -d ../assets ]; then
            mkdir -p assets
            rsync -rL --delete ../assets/ assets/
          fi
          svn add --force . || true
          svn status | awk '/^!/{print $2}' | while IFS= read -r file; do
            [ -n "$file" ] || continue
            svn rm "$file" || true
          done
          svn status
          svn commit -m "Release version $VERSION" --username "$SVN_USERNAME" --password "$SVN_PASSWORD" --no-auth-cache --non-interactive --trust-server-cert

      - name: Cleanup SVN checkout
        if: always()
        run: rm -rf svn

      - name: Notify on success
        if: success()
        run: |
          echo "🤖 Plugin with Version ${RELEASE_TAG} successfully deployed to WordPress.org! 🚀"
